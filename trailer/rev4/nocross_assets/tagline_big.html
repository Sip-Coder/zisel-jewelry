<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../invite/zisel.css"><style>html,body{background:none!important;width:1080px;height:1920px;overflow:hidden}</style></head><body><div style="position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;top:1500px"><div style="width:120px;height:2px;background:var(--gold)"></div><div class="fit" style="font-family:ZPlay;font-style:italic;font-size:30px;color:#dfe6f5;margin-top:14px"><span class="ln">Wholesale Diamond &amp; Fine Jewelry</span></div></div><script>document.fonts.ready.then(()=>{for(const e of document.querySelectorAll(".fit")){const r=document.createRange();let w=0;for(const l of e.querySelectorAll(".ln")){r.selectNodeContents(l);w=Math.max(w,r.getBoundingClientRect().width)}const fs=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(fs*945/w)+"px"}document.body.dataset.ok=1})</script></body></html>
